<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Blocked · Focus Lock</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #090b0e;
    color: #f2f4f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  }
  .card {
    text-align: center;
    max-width: 440px;
    padding: 48px 36px;
    background: #131720;
    border: 1px solid #232a38;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  .icon-wrapper {
    width: 64px;
    height: 64px;
    background: rgba(79, 124, 255, 0.15);
    color: #4f7cff;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 20px;
  }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 10px; color: #ffffff; }
  p { color: #8e99a8; font-size: 14px; line-height: 1.5; margin-bottom: 28px; }
  .btn {
    display: inline-block;
    background: #4f7cff;
    color: #ffffff;
    padding: 12px 28px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:hover { background: #3b68f0; transform: translateY(-1px); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">🔒</div>
    <h1 id="site-name">This site is blocked</h1>
    <p>You added this site to your Focus Lock blocklist. Stay on track with your study goals!</p>
    <a href="http://localhost:5173/study-hub" id="back-link" class="btn">Return to Study Hub</a>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
